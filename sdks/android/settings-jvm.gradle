// Isolated settings for building/testing the pure-JVM :library-jvm module without
// configuring the Android modules (which need the Android SDK).
// Usage: ./gradlew -c settings-jvm.gradle :library-jvm:test
pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}
rootProject.name = "xmtp-android"
include ':library-jvm'
