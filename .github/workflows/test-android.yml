name: Test Android

on:
  workflow_call:

jobs:
  unit-tests:
    name: Unit Tests (Android)
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          disk-key: test-android
          gradle-disk: "true"
          docker-builder: "true"
          github-token: ${{ github.token }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: taiki-e/install-action@just
      - name: Start backend
        env:
          NIX_DEVSHELL: android
        run: just backend up
      - name: Run unit tests
        env:
          NIX_DEVSHELL: android
        run: just android test

  # End-to-end tests now run on the host JVM (org.xmtp:xmtp-jvm engine + libxmtp
  # via JNA) against the local docker backend — no emulator/KVM required, so this
  # is far cheaper than the old instrumented `connectedCheck` job.
  jvm-e2e-tests:
    name: E2E Tests (JVM)
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          disk-key: test-android
          gradle-disk: "true"
          docker-builder: "true"
          github-token: ${{ github.token }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: taiki-e/install-action@just
      - name: Start backend
        env:
          NIX_DEVSHELL: android
        run: just backend up
      - name: Run JVM E2E tests
        env:
          NIX_DEVSHELL: android
        run: just android test-jvm

  # NOTE: a small Android *instrumented* smoke suite (device .so load + Context DB/log
  # paths + @aar JNA) should be added back to guard the published AAR; the bulk E2E
  # coverage now lives in the JVM job above.
